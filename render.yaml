services:
  - type: web
    name: rescuevision-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install --no-cache-dir --extra-index-url https://download.pytorch.org/whl/cpu -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: FREE_TIER_MODE
        value: "true"
      - key: YOLO_MODEL_NAME
        value: yolov8n.pt
      - key: FRONTEND_ORIGINS
        value: https://rescuevision-dashboard.onrender.com

  - type: web
    name: rescuevision-dashboard
    runtime: static
    buildCommand: npm ci && npm --prefix frontend ci && npm run build
    staticPublishPath: frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://rescuevision-api.onrender.com